<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Momentum Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column (phone-first), a timeline of time blocks as the hero of the Day view; quadrants named after desserts. */
:root{
  --bg:#FAF7F9; --surface:#FFFFFF; --ink:#2B2330; --muted:#76697D; --line:#ECE3EA; --hover:#F4EEF3;
  --do:#D9486A; --do-soft:#FBE3E9;
  --plan:#4F8A5D; --plan-soft:#E2EFE3;
  --quick:#C98A1E; --quick-soft:#FBEFD8;
  --drop:#8B7FA6; --drop-soft:#EEEAF5;
  --fixed:#A99DB0;
  --accent:#D9486A; --on-accent:#FFFFFF;
  --f-display:"Young Serif", Georgia, "Times New Roman", serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#16121A; --surface:#211B26; --ink:#F3ECF4; --muted:#A99DB0; --line:#352C3C; --hover:#2A2330;
  --do:#F27C93; --do-soft:#3B2029; --plan:#8CC79A; --plan-soft:#1E2F23; --quick:#EDBA62; --quick-soft:#372B16;
  --drop:#B8ADD0; --drop-soft:#29243A; --fixed:#7E7286; --accent:#F27C93; --on-accent:#1A0F14; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#16121A; --surface:#211B26; --ink:#F3ECF4; --muted:#A99DB0; --line:#352C3C; --hover:#2A2330;
  --do:#F27C93; --do-soft:#3B2029; --plan:#8CC79A; --plan-soft:#1E2F23; --quick:#EDBA62; --quick-soft:#372B16;
  --drop:#B8ADD0; --drop-soft:#29243A; --fixed:#7E7286; --accent:#F27C93; --on-accent:#1A0F14; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 64px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:-.01em}
.eyebrow{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:6px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font-family:var(--f-display);font-weight:400;font-size:20px}
.sync{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--hover);border-radius:999px;padding:3px}
.tabs a{padding:6px 12px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:600;font-size:13.5px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* day header */
.dayhead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.dayhead h1{font-size:clamp(30px,7vw,42px);line-height:1.05}
.navbtns{display:flex;gap:6px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:16px}
.iconbtn:hover{background:var(--hover)}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pillbtn:hover{background:var(--hover)}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:14px}
.weekstrip button{border:0;background:transparent;border-radius:12px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
.weekstrip button .n{font-weight:700;color:var(--ink);font-size:15px}
.weekstrip button.sel{background:var(--ink);color:var(--bg)}
.weekstrip button.sel .n{color:var(--bg)}
.weekstrip .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.weekstrip .dot.on{background:var(--accent)}
.statline{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 10px;font-size:12.5px;background:var(--hover);color:var(--ink);font-weight:500}

/* sections */
section.block{margin-top:26px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.sechead h2{font-size:22px}
.step-n{font-family:var(--f-mono);font-size:12px;color:var(--accent);margin-right:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
details.plan > summary{list-style:none;cursor:pointer}
details.plan > summary::-webkit-details-marker{display:none}
.hint{font-size:13px;color:var(--muted)}
textarea.dump{width:100%;min-height:96px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;resize:vertical;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.accent{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}

/* matrix */
.matrix{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.quad{border-radius:12px;padding:10px;min-height:96px;display:flex;flex-direction:column;gap:6px;min-width:0}
.quad h3{font-family:var(--f-body);font-weight:700;font-size:13.5px}
.quad .sub{font-size:11.5px;color:var(--muted);margin-top:-4px}
.q-do{background:var(--do-soft)} .q-do h3{color:var(--do)}
.q-plan{background:var(--plan-soft)} .q-plan h3{color:var(--plan)}
.q-quick{background:var(--quick-soft)} .q-quick h3{color:var(--quick)}
.q-drop{background:var(--drop-soft)} .q-drop h3{color:var(--drop)}
.q-none{background:var(--hover);grid-column:1/-1}
.tchip{display:flex;justify-content:space-between;gap:6px;align-items:center;text-align:left;border:0;background:var(--surface);border-radius:9px;padding:6px 8px;font-size:13px;min-width:0;width:100%}
.tchip span.t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tchip .est{font-family:var(--f-mono);font-size:11px;color:var(--muted);flex:none}
.tchip.done span.t{text-decoration:line-through;color:var(--muted)}
.tchip.example::after{content:"example";font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 4px;flex:none}
.quad .empty{font-size:12px;color:var(--muted)}

/* timeline */
.timeline{position:relative;display:flex;flex-direction:column;gap:6px}
.tl{display:grid;grid-template-columns:62px 18px 1fr;gap:8px;align-items:stretch}
.tl .time{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);text-align:right;padding-top:12px;font-variant-numeric:tabular-nums}
.tl .rail{position:relative;display:flex;justify-content:center}
.tl .rail::before{content:"";position:absolute;top:0;bottom:-6px;width:2px;background:var(--line)}
.tl:last-child .rail::before{bottom:50%}
.tl .node{position:relative;margin-top:14px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--fixed)}
.tl.k-do .node{border-color:var(--do);background:var(--do)}
.tl.k-plan .node{border-color:var(--plan);background:var(--plan)}
.tl.k-quick .node{border-color:var(--quick);background:var(--quick)}
.tl.k-break .node{width:8px;height:8px;margin-top:16px}
.tl .body{min-width:0;border-radius:12px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.tl.fixed .body{background:transparent;border-style:dashed}
.tl.k-break .body{background:transparent;border:0;padding:6px 12px}
.tl.past .body{opacity:.55}
.tl.isdone .title{text-decoration:line-through;color:var(--muted)}
.tl .main{flex:1;min-width:0}
.tl .title{font-weight:600;overflow-wrap:anywhere}
.tl .meta{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.tl .first{font-size:12.5px;margin-top:4px;color:var(--ink)}
.tl .first em{font-style:normal;color:var(--muted)}
.check{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--fixed);background:transparent;display:grid;place-items:center;margin-top:1px;padding:0}
.check.on{background:var(--plan);border-color:var(--plan);color:var(--surface)}
.check svg{width:14px;height:14px}
.startbtn{display:inline-block;margin-top:8px;border:0;border-radius:999px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:12.5px;padding:6px 10px;white-space:nowrap}
.sublist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.sublist label{display:flex;gap:8px;align-items:center;font-size:13.5px}
.nowline{display:grid;grid-template-columns:62px 18px 1fr;gap:8px;align-items:center}
.nowline .time{font-family:var(--f-mono);font-size:12px;color:var(--accent);text-align:right;font-weight:500}
.nowline .bar{grid-column:2/4;height:2px;background:var(--accent);border-radius:2px;position:relative}
.nowline .bar::before{content:"";position:absolute;left:3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.emptybox{border:1px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--muted)}

.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);min-width:0}
.li .t{min-width:0;overflow-wrap:anywhere}
.li .s{font-size:12.5px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:13px;padding:4px 2px;white-space:nowrap}
.choices{display:flex;flex-wrap:wrap;gap:6px}
.choice{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px}
.choice[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.park{display:flex;gap:8px}
.park input{flex:1;min-width:0;border:1px solid var(--line);border-radius:999px;background:var(--surface);padding:8px 14px}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--quick-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;margin-top:14px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,20,.42);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.field input,.field textarea,.field select{border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:9px 11px;width:100%}
.qpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.qpick button{border:2px solid transparent;border-radius:10px;padding:8px;text-align:left;font-size:13px;font-weight:600}
.qpick button small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.qpick .do{background:var(--do-soft)} .qpick .plan{background:var(--plan-soft)} .qpick .quick{background:var(--quick-soft)} .qpick .drop{background:var(--drop-soft)}
.qpick button[aria-pressed="true"]{border-color:var(--ink)}

/* focus overlay */
.focus{position:fixed;inset:0;z-index:50;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(20px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px))}
.focus h2{font-size:clamp(24px,6vw,34px);max-width:22ch}
.focus .timer{font-family:var(--f-mono);font-size:clamp(56px,18vw,96px);font-weight:500;letter-spacing:-.02em;line-height:1}
.focus .first{max-width:40ch;opacity:.85}
.focus .row{justify-content:center}
.focus .btn{background:var(--bg);color:var(--ink)}
.focus .btn.ghost{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.3)}
.focus .park{width:100%;max-width:420px}
.focus .park input{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.3)}
.focus .park input::placeholder{color:rgba(255,255,255,.55)}
:root[data-theme="dark"] .focus .park input,:root[data-theme="dark"] .focus .btn.ghost{border-color:rgba(0,0,0,.25)}
.focus .close{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:calc(14px + env(safe-area-inset-right,0px));background:transparent;border:0;color:var(--bg);font-size:26px;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:60;font-weight:600}

/* calendar views */
.weekrows{display:flex;flex-direction:column;gap:6px}
.wrow{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%}
.wrow.today{border-color:var(--accent)}
.wrow .d{font-weight:700}
.wrow .d small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.wrow .items{min-width:0;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wrow .items b{color:var(--do);font-weight:600}
.bar{height:6px;border-radius:6px;background:var(--hover);overflow:hidden;width:64px}
.bar i{display:block;height:100%;background:var(--plan)}
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:14px}
.stat{padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--f-display);font-size:28px;line-height:1.1}
.stat .l{font-size:12.5px;color:var(--muted)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .dow{font-size:11px;text-align:center;color:var(--muted);font-weight:700;letter-spacing:.06em;padding-bottom:4px}
.mcell{aspect-ratio:1/1.05;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:5px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-width:0;overflow:hidden}
.mcell.out{opacity:.35}
.mcell.today{border-color:var(--accent);border-width:2px}
.mcell .n{font-weight:700;font-size:13px}
.mcell .dl{font-size:10.5px;line-height:1.2;color:var(--do);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.mcell .prog{margin-top:auto;font-family:var(--f-mono);font-size:10.5px;color:var(--muted)}
.semcard{display:flex;flex-direction:column;gap:10px}
.semprog{height:10px;border-radius:10px;background:var(--hover);overflow:hidden}
.semprog i{display:block;height:100%;background:var(--accent)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.dlgroup h3{font-family:var(--f-body);font-weight:700;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 0 6px}
@media (prefers-reduced-motion:no-preference){.tl,.li,.tchip{transition:background .15s}}
@media (max-width:420px){.tl{grid-template-columns:48px 14px 1fr;gap:6px}.nowline{grid-template-columns:48px 14px 1fr;gap:6px}.tl .time{font-size:11.5px}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>Momentum</b><span class="sync" id="sync">Saved on this device</span></div>
    <nav class="tabs" aria-label="Zoom level">
      <a href="#day" data-v="day">Day</a><a href="#week" data-v="week">Week</a><a href="#month" data-v="month">Month</a><a href="#semester" data-v="semester">Semester</a>
    </nav>
  </header>
  <main id="app"></main>
</div>
<div id="layer"></div>

<script>
(() => {
/* ---------- utils ---------- */
const $ = (s, el = document) => el.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseYmd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); };
const toMin = t => { const [h, m] = String(t || '0:0').split(':').map(Number); return (h || 0) * 60 + (m || 0); };
const fmt = min => { const m = ((min % 1440) + 1440) % 1440; return `${pad(Math.floor(m / 60))}:${pad(m % 60)}`; };
const dur = m => m >= 60 ? `${Math.floor(m / 60)}h${m % 60 ? pad(m % 60) : ''}` : `${m}m`;
const r5 = n => Math.ceil(n / 5) * 5;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const today = () => ymd(new Date());
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const daysBetween = (a, b) => Math.round((parseYmd(b) - parseYmd(a)) / 864e5);
const mondayOf = s => { const d = parseYmd(s); const k = (d.getDay() + 6) % 7; d.setDate(d.getDate() - k); return ymd(d); };
const CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>';

const Q = {
  do:    { name: 'Do first',   sub: 'Urgent + important' },
  plan:  { name: 'Schedule',   sub: 'Important, not urgent' },
  quick: { name: 'Quick wins', sub: 'Urgent, not important' },
  drop:  { name: 'Not today',  sub: 'Neither. Let it go' },
};
const PULLS = ['Curiosity rabbit hole', 'YouTube Shorts', 'Facebook', 'Instagram', 'C-drama', 'Tired', 'Nothing, I was on it'];

/* ---------- state ---------- */
const DEFAULT_SETTINGS = { wake: '06:00', sleep: '01:00', gymStart: '15:00', gymEnd: '16:00', meal1Start: '10:30', meal1End: '11:00', meal2Start: '18:00', meal2End: '18:30', buffer: 25, focus: 50 };
let S = null;
let ui = { date: today(), view: 'day' };
const dirty = new Set();

function blankState() {
  return { v: 1, settings: { ...DEFAULT_SETTINGS }, semester: { name: 'Semester 1', start: '2026-08-10', end: '2026-12-06' }, deadlines: [], parked: [], days: {} };
}
function seedExamples(st) {
  const t = today();
  st.days[t] = { tasks: [
    { id: uid(), title: 'Stats assignment 2', q: 'do', est: 90, example: true, first: 'Open the brief and highlight what the rubric rewards',
      steps: [ { id: uid(), text: 'Re-read brief and rubric', est: 15, done: false }, { id: uid(), text: 'Solve Q1 to Q3', est: 45, done: false }, { id: uid(), text: 'Write up and check', est: 30, done: false } ] },
    { id: uid(), title: 'Read Ch. 7 for marketing seminar', q: 'plan', est: 45, example: true, first: 'Read the chapter summary first', steps: [] },
    { id: uid(), title: 'Reply in group project chat', q: 'quick', est: 10, example: true, steps: [] },
    { id: uid(), title: 'Print lab sheet', q: 'quick', est: 10, example: true, steps: [] },
    { id: uid(), title: 'Reorganise my notes app', q: 'drop', est: 30, example: true, steps: [] },
  ], blocks: [], overflow: [], starts: {}, review: {} };
  st.deadlines = [

/* ---------- persistence: account (db capability) with device fallback ---------- */
const LS_KEY = 'momentum-planner-v1';

    const timeout = new Promise(r => setTimeout(() => r(null), 10000));
    const db = await Promise.race([window.claude.use('db'), timeout]);
    const user = db && await Promise.race([window.claude.use('user'), timeout]);

        let body; try { body = JSON.parse(d.data().json); } catch (e) { continue; }
        if (d.id === 'core') Object.assign(st, body, { settings: { ...DEFAULT_SETTINGS, ...(body.settings || {}) } });

    } else {
      coll = c;
      dirty.add('core'); Object.keys(S.days).forEach(k => dirty.add('day:' + k));

}

/* ---------- scheduling ---------- */
function fixedBlocks() {
  const s = S.settings;
  return [
    { kind: 'meal', title: 'Brunch', start: toMin(s.meal1Start), end: toMin(s.meal1End), note: 'Eat away from the desk. Food Shorts allowed here.' },
    { kind: 'gym', title: 'Gym', start: toMin(s.gymStart), end: toMin(s.gymEnd), note: 'Non-negotiable. Save your C-drama episode for the treadmill.' },
    { kind: 'meal', title: 'Dinner', start: toMin(s.meal2Start), end: toMin(s.meal2End), note: 'Catch up on Facebook and Instagram here, not mid-task.' },
  ].filter(b => b.end > b.start).sort((a, b) => a.start - b.start);
}
function bounds() { const w = toMin(S.settings.wake); let sl = toMin(S.settings.sleep); if (sl <= w) sl += 1440; return [w, sl]; }
function stepsOf(t) { return t.steps || []; }
function buildUnits(day) {
  const order = { do: 0, plan: 1, quick: 2 };
  const tasks = day.tasks.filter(t => !t.done && t.q !== 'drop');
  tasks.sort((a, b) => order[a.q || 'plan'] - order[b.q || 'plan']);
  const units = [], quick = [];
  for (const t of tasks) {
    const q = t.q || 'plan';
    const open = stepsOf(t).filter(s => !s.done);
    if (q === 'quick' && (t.est || 15) <= 20 && !open.length) { quick.push(t); continue; }
    if (open.length) open.forEach(s => units.push({ taskId: t.id, stepId: s.id, q, title: s.text, parent: t.title, est: s.est || 25 }));
    else units.push({ taskId: t.id, q, title: t.title, est: t.est || 30 });
  }
  if (quick.length) units.push({ taskIds: quick.map(t => t.id), q: 'quick', title: 'Quick wins batch', est: quick.reduce((a, t) => a + (t.est || 10), 0) });
  return units;
}
function blockDone(day, b) {
  if (b.taskIds) return b.taskIds.every(id => { const t = day.tasks.find(x => x.id === id); return t ? !!t.done : true; });
  const t = day.tasks.find(t => t.id === b.taskId);
  if (!t) return true;
  if (b.stepId) { const s = stepsOf(t).find(s => s.id === b.stepId); return s ? !!s.done : !!t.done; }

}
function planDay(date, fromMin) {
  const day = getDay(date), s = S.settings, [wake, sleep] = bounds();
  const keep = day.blocks.filter(b => b.start < fromMin && (b.end <= fromMin || blockDone(day, b) || day.starts[b.id] != null));
  const busy = [...fixedBlocks(), ...keep];
  const blocks = keep.slice(), overflow = [];
  let cursor = Math.max(wake, fromMin);
  keep.forEach(b => { if (b.end > cursor) cursor = b.end; });
  let streak = 0;
  const nextFree = c => {
    let moved = true;
    while (moved) { moved = false; for (const f of busy) if (c >= f.start && c < f.end) { c = f.end; moved = true; streak = 0; } }
    let end = sleep; for (const f of busy) if (f.start >= c && f.start < end) end = f.start;
    return [c, end];
  };
  for (const u of buildUnits(day)) {
    if (u.taskIds === undefined && keep.some(b => b.taskId === u.taskId && b.stepId === u.stepId && !blockDone(day, b) && day.starts[b.id] != null)) continue;
    let remaining = r5(u.est * (1 + s.buffer / 100));
    const parts = [];
    let guard = 0;
    while (remaining > 0 && guard++ < 500) {
      const [a, b] = nextFree(cursor);
      if (a >= sleep) break;
      if (b - a < 10 && remaining >= 10) { cursor = b; streak = 0; continue; }
      if (streak >= s.focus || (streak > 0 && remaining > s.focus - streak)) { const bl = Math.min(10, b - a); blocks.push({ id: uid(), kind: 'break', title: 'Break: stand up, water, no phone', start: a, end: a + bl }); cursor = a + bl; streak = 0; continue; }
      let len = Math.min(remaining, s.focus - streak, b - a);
      if (remaining - len > 0 && remaining - len <= 15 && remaining <= b - a) len = remaining; // no tiny leftovers
      parts.push({ start: a, end: a + len }); cursor = a + len; streak += len; remaining -= len;
    }

    parts.forEach((p, i) => blocks.push({ id: uid(), kind: 'task', q: u.q, taskId: u.taskId, stepId: u.stepId, taskIds: u.taskIds, title: u.title, parent: u.parent, start: p.start, end: p.end, part: parts.length > 1 ? `part ${i + 1} of ${parts.length}` : '' }));

}

}

/* ---------- metrics ---------- */
function startStats(dates) {
  let planned = 0, onTime = 0;
  const n = nowMin(), t = today();
  for (const d of dates) {
    const day = peekDay(d); if (!day) continue;
    for (const b of day.blocks || []) {

/* ---------- parsing the brain dump ---------- */
function parseLine(line) {
  let s = ' ' + line.trim() + ' ';
  let est = null, imp = false, urg = false;
  const hm = s.match(/\s(\d+)\s*h\s*(\d+)\s*(m|min)?\s/i);
  if (hm) { est = +hm[1] * 60 + +hm[2]; s = s.replace(hm[0], ' '); }
  else {
    const m = s.match(/\s(\d+(?:\.\d+)?)\s*(h|hr|hrs|hour|hours|m|min|mins)\s/i);
    if (m) { est = Math.round(/^h/i.test(m[2]) ? +m[1] * 60 : +m[1]); s = s.replace(m[0], ' '); }
  }
  if (/\s!i\s/i.test(s)) { imp = true; s = s.replace(/\s!i\s/ig, ' '); }
  if (/\s!u\s/i.test(s)) { urg = true; s = s.replace(/\s!u\s/ig, ' '); }
  if (/\s!!\s/.test(s)) { imp = urg = true; s = s.replace(/\s!!\s/g, ' '); }
  const title = s.trim().replace(/\s{2,}/g, ' ');
  const q = imp && urg ? 'do' : imp ? 'plan' : urg ? 'quick' : null;
  return title ? { id: uid(), title, q, est: est || 30, steps: [], done: false } : null;
}
function parseSteps(text, old = []) {
  return text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
    let est = null, t = ' ' + l + ' ';
    const m = t.match(/\s(\d+)\s*(m|min|mins|h|hr)\s*$/i);
    if (m) { est = /^h/i.test(m[2]) ? +m[1] * 60 : +m[1]; t = t.slice(0, m.index); }
    t = t.trim();
    const prev = old.find(o => o.text === t);
    return { id: prev?.id || uid(), text: t, est: est || prev?.est || 25, done: prev?.done || false };
  });
}
const stepsToText = steps => (steps || []).map(s => `${s.text} ${s.est}m`).join('\n');

function renderBlock(day, b, past) {
  const time = `<span class="time">${fmt(b.start)}</span>`;
  if (b.fixed) {
    return `<div class="tl fixed${past ? ' past' : ''}">${time}<div class="rail"><span class="node"></span></div><div class="body"><div class="main"><div class="title">${esc(b.title)} <span class="meta mono">· ${fmt(b.start)}–${fmt(b.end)}</span></div><div class="meta">${esc(b.note || '')}</div></div></div></div>`;
  }
  if (b.kind === 'break') {

  }
  const done = blockDone(day, b);
  const len = b.end - b.start;
  let inner;
  if (b.taskIds) {

    inner = `<div class="main"><div class="title">${esc(b.title)}</div><div class="meta mono">${fmt(b.start)}–${fmt(b.end)} · ${dur(len)}</div>

  } else {
    const t = day.tasks.find(t => t.id === b.taskId);
    const first = t?.first ? `<div class="first"><em>First move:</em> ${esc(t.first)}</div>` : '';

      <div class="main"><div class="title">${esc(b.title)}</div><div class="meta"><span class="mono">${fmt(b.start)}–${fmt(b.end)} · ${dur(len)}</span>${b.parent ? ` · ${esc(b.parent)}` : ''}${b.part ? ` · ${b.part}` : ''}</div>${!b.stepId || stepsOf(t || {})[0]?.id === b.stepId ? first : ''}</div>`;

function renderMonth() {

/* ---------- edit sheet ---------- */
const layer = $('#layer');
let sheetTaskId = null, delArmed = false;
function openSheet(id) {
  const day = getDay(ui.date), t = day.tasks.find(x => x.id === id); if (!t) return;
  sheetTaskId = id; delArmed = false;
  layer.innerHTML = `<div class="scrim" data-act="close-sheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="e-title-lbl" data-stop>
    <div class="row" style="justify-content:space-between"><span class="eyebrow">Edit task</span><button class="iconbtn" data-act="close-sheet" aria-label="Close">×</button></div>

    <div class="field"><label>Which box?</label><div class="qpick">${Object.keys(Q).map(k => `<button class="${k}" data-act="pick-q" data-q="${k}" aria-pressed="${t.q === k}">${Q[k].name}<small>${Q[k].sub}</small></button>`).join('')}</div></div>
    <div class="field"><label for="e-est">How long, honestly? (minutes)</label><div class="row">${[10, 25, 45, 60, 90, 120].map(m => `<button class="choice" data-act="pick-est" data-m="${m}" aria-pressed="${t.est === m}">${dur(m)}</button>`).join('')}<input id="e-est" type="number" min="5" step="5" value="${t.est || 30}" style="width:90px"></div></div>
    <div class="field"><label for="e-first">First tiny move (2 minutes or less)</label><input id="e-first" value="${esc(t.first || '')}" placeholder="e.g. open the doc and write the heading"></div>
    <div class="field"><label for="e-steps">Break it down: one step per line, time at the end</label><textarea id="e-steps" rows="4" placeholder="Find 3 sources 30m&#10;Outline the argument 20m&#10;Draft intro 25m">${esc(stepsToText(t.steps))}</textarea><span class="hint">Each step becomes its own block on the schedule. Smaller steps are easier to start.</span></div>
    <div class="row" style="justify-content:space-between">
      <div class="row"><button class="btn ghost small" data-act="del-task" id="del-btn">Delete</button><button class="btn ghost small" data-act="tomorrow">Move to tomorrow</button></div>
      <button class="btn" data-act="save-sheet">Save</button>
    </div>
  </div></div>`;
  setTimeout(() => $('#e-title')?.focus(), 30);
}
function saveSheet() {
  const day = getDay(ui.date), t = day.tasks.find(x => x.id === sheetTaskId); if (!t) return closeSheet();
  t.title = $('#e-title').value.trim() || t.title;
  t.est = Math.max(5, parseInt($('#e-est').value, 10) || 30);
  t.first = $('#e-first').value.trim();
  t.steps = parseSteps($('#e-steps').value, t.steps);
  if (t.steps.length) t.est = t.steps.reduce((a, s) => a + s.est, 0);
  const picked = layer.querySelector('.qpick [aria-pressed="true"]');
  if (picked) t.q = picked.dataset.q;
  delete t.example;
  touchDay(ui.date); closeSheet(); render();
}
function closeSheet() { layer.innerHTML = ''; sheetTaskId = null; }

/* ---------- focus mode ---------- */
let focus = null, tick = null, wakeLock = null;
function startFocus(blockId) {
  const day = getDay(ui.date), b = day.blocks.find(x => x.id === blockId); if (!b) return;
  if (day.starts[b.id] == null && ui.date === today()) { day.starts[b.id] = nowMin(); touchDay(ui.date); }
  const t = b.taskId ? day.tasks.find(x => x.id === b.taskId) : null;
  focus = { blockId, phase: 'five', endAt: Date.now() + 5 * 60e3, title: b.title, parent: b.parent, first: t?.first || (b.taskIds ? 'Do the smallest one first' : 'Open what you need and do one ugly first line'), blockLen: b.end - b.start };
  try { navigator.wakeLock?.request('screen').then(l => wakeLock = l).catch(() => {}); } catch (e) {}
  drawFocus(); clearInterval(tick); tick = setInterval(updateTimer, 1000);
}
function drawFocus() {
  if (!focus) return;
  const five = focus.phase === 'five', after = focus.phase === 'after', deep = focus.phase === 'deep';
  layer.innerHTML = `<div class="focus" role="dialog" aria-modal="true" aria-label="Focus">
    <button class="close" data-act="end-focus" aria-label="Close focus">×</button>
    <div class="eyebrow" style="color:inherit;opacity:.7">${five ? 'Just five minutes. You can stop after.' : after ? "You started. That's the hard part." : 'Momentum mode'}</div>
    <h2>${esc(focus.title)}</h2>
    ${focus.parent ? `<div style="opacity:.7;margin-top:-10px">${esc(focus.parent)}</div>` : ''}
    ${after ? '' : `<div class="timer" id="timer">5:00</div>`}
    <div class="first">${five ? `First move: ${esc(focus.first)}` : after ? 'Most people keep going once they have started. Want to?' : 'Phone face down. If a thought pops up, park it below.'}</div>
    <div class="row">${after ? `<button class="btn" data-act="keep-going">Keep going (${Math.max(5, focus.blockLen - 5)}m)</button><button class="btn ghost" data-act="end-focus">Stop here</button>` : `<button class="btn" data-act="focus-done">Done with this</button><button class="btn ghost" data-act="end-focus">Pause</button>`}</div>
    <form class="park" data-form="park-focus"><input id="park-focus" placeholder="Curious about something? Park it here" autocomplete="off"><button class="btn ghost" type="submit">Park</button></form>
  </div>`;
  updateTimer();
}
function updateTimer() {
  if (!focus) return;
  const left = Math.max(0, focus.endAt - Date.now());
  const el = $('#timer');
  if (el) el.textContent = `${Math.floor(left / 60000)}:${pad(Math.floor(left / 1000) % 60)}`;
  if (left <= 0 && focus.phase === 'five') { focus.phase = 'after'; drawFocus(); }
  else if (left <= 0 && focus.phase === 'deep') { toast('Block finished. Take your break.'); endFocus(); }
}
function endFocus() { clearInterval(tick); focus = null; layer.innerHTML = ''; try { wakeLock?.release(); } catch (e) {} wakeLock = null; render(); }

/* ---------- actions ---------- */
function toggleBlock(id) {
  const day = getDay(ui.date), b = day.blocks.find(x => x.id === id); if (!b) return;
  const t = day.tasks.find(x => x.id === b.taskId); if (!t) return;
  if (b.stepId) {
    const s = stepsOf(t).find(x => x.id === b.stepId);
    if (s) { s.done = !s.done; t.done = stepsOf(t).every(x => x.done); }
  } else { t.done = !t.done; if (t.done) stepsOf(t).forEach(s => s.done = true); }
  touchDay(ui.date);
}
function addParked(text) { text = text.trim(); if (!text) return; S.parked.push({ id: uid(), text, ts: Date.now() }); touch('core'); toast('Parked. Back to it.'); }
let toastTimer = null;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 2200);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast('Copied'); }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); toast('Copied'); } catch (e2) { toast('Select the text and copy it'); }
    ta.remove();
  }
}
function dayAsText(date) {
  const day = getDay(date), { full } = dayTitle(date);
  const items = [...day.blocks, ...fixedBlocks().map(f => ({ ...f, fixed: true }))].sort((a, b) => a.start - b.start);
  const lines = [`${full}`, ''];
  for (const it of items) {
    if (it.kind === 'break') continue;
    const box = it.fixed ? '  ' : blockDone(day, it) ? '[x]' : '[ ]';
    let title = it.taskIds ? `${it.title}: ${it.taskIds.map(id => day.tasks.find(t => t.id === id)?.title).filter(Boolean).join(', ')}` : it.title + (it.parent ? ` (${it.parent})` : '');
    lines.push(`${fmt(it.start)}-${fmt(it.end)} ${box} ${title}`);
  }
  lines.push(`${S.settings.sleep}  Lights out`);
  return lines.join('\n');
}
function clearExamples() {
  for (const [d, day] of Object.entries(S.days)) {
    const before = day.tasks.length;
    day.tasks = day.tasks.filter(t => !t.example);
    if (day.tasks.length !== before) { const ids = new Set(day.tasks.map(t => t.id)); day.blocks = day.blocks.filter(b => b.kind !== 'task' ? false : b.taskIds ? b.taskIds.some(i => ids.has(i)) : ids.has(b.taskId)); if (!day.blocks.length) day.overflow = []; touchDay(d); }
  }
  S.deadlines = S.deadlines.filter(d => !d.example);
  S.hasExamples = false; touch('core'); toast('Examples cleared'); render();
}
let restoreArmed = false;

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'close-sheet' && e.target.closest('[data-stop]') && !e.target.closest('.iconbtn')) return;
  const day = () => getDay(ui.date);
  switch (act) {
    case 'prev': ui.date = addDays(ui.date, -1); render(); break;
    case 'next': ui.date = addDays(ui.date, 1); render(); break;
    case 'today': ui.date = today(); render(); break;
    case 'goto': ui.date = el.dataset.date; render(); break;
    case 'open-day': ui.date = el.dataset.date; location.hash = 'day'; break;
    case 'prev-week': ui.date = addDays(ui.date, -7); render(); break;
    case 'next-week': ui.date = addDays(ui.date, 7); render(); break;
    case 'prev-month': { const d = parseYmd(ui.date); ui.date = ymd(new Date(d.getFullYear(), d.getMonth() - 1, 1)); render(); break; }

    case 'add': {

    case 'pick-est': $('#e-est').value = el.dataset.m; layer.querySelectorAll('[data-act="pick-est"]').forEach(b => b.setAttribute('aria-pressed', b === el)); break;
    case 'save-sheet': saveSheet(); break;
    case 'close-sheet': closeSheet(); break;
    case 'del-task':
      if (!delArmed) { delArmed = true; el.textContent = 'Tap again to delete'; break; }
      { const d = day(); d.tasks = d.tasks.filter(t => t.id !== sheetTaskId); d.blocks = d.blocks.filter(b => b.taskId !== sheetTaskId); d.blocks.forEach(b => { if (b.taskIds) b.taskIds = b.taskIds.filter(i => i !== sheetTaskId); }); d.blocks = d.blocks.filter(b => !b.taskIds || b.taskIds.length); touchDay(ui.date); closeSheet(); render(); }
      break;
    case 'tomorrow': {
      const d = day(), t = d.tasks.find(x => x.id === sheetTaskId); if (!t) break;
      d.tasks = d.tasks.filter(x => x.id !== t.id); d.blocks = d.blocks.filter(b => b.taskId !== t.id);
      const tm = addDays(ui.date, 1); getDay(tm).tasks.push(t); touchDay(ui.date); touchDay(tm); closeSheet(); render(); toast('Moved to tomorrow'); break;
    }
    case 'plan': planDay(ui.date, planFrom(ui.date)); render(); setTimeout(() => document.querySelector('.timeline')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); break;
    case 'toggle-block': toggleBlock(el.dataset.id); render(); break;

    }

    case 'unpark': S.parked = S.parked.filter(p => p.id !== el.dataset.id); touch('core'); render(); break;
    case 'pull': { const r = day().review; r.pulls ||= []; const p = el.dataset.p; r.pulls = r.pulls.includes(p) ? r.pulls.filter(x => x !== p) : [...r.pulls, p]; touchDay(ui.date); el.setAttribute('aria-pressed', r.pulls.includes(p)); break; }

    }
    case 'del-deadline': S.deadlines = S.deadlines.filter(x => x.id !== el.dataset.id); touch('core'); render(); break;
    case 'clear-examples': clearExamples(); break;
    case 'backup-copy': flushNow(); copyText(JSON.stringify(S)); break;
    case 'backup-restore': {
      const raw = $('#backup').value.trim(); if (!raw) { $('#backup').focus(); break; }
      let data; try { data = JSON.parse(raw); if (!data.days || !data.settings) throw 0; } catch (err) { toast("That doesn't look like a Momentum backup"); break; }
      if (!restoreArmed) { restoreArmed = true; el.textContent = 'Tap again: this replaces everything'; break; }
      restoreArmed = false; S = Object.assign(blankState(), data); S.settings = { ...DEFAULT_SETTINGS, ...data.settings };
      dirty.add('core'); Object.keys(S.days).forEach(k => dirty.add('day:' + k)); flush(); render(); toast('Restored'); break;
    }
  }
});
function flushNow() { clearTimeout(saveTimer); flush(); }
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]'); if (!f) return; e.preventDefault();
  if (f.dataset.form === 'park') { addParked($('#park-in').value); render(); setTimeout(() => $('#park-in')?.focus(), 0); }
  if (f.dataset.form === 'park-focus') { addParked($('#park-focus').value); $('#park-focus').value = ''; }
  if (f.dataset.form === 'deadline') {
    const title = $('#dl-title').value.trim(), date = $('#dl-date').value; if (!title || !date) return;
    S.deadlines.push({ id: uid(), title, date }); touch('core'); render(); toast('Deadline added');
  }
});
document.addEventListener('change', e => {
  const el = e.target.closest('[data-set]'); if (!el) return;
  const [obj, key] = el.dataset.set.split('.');
  let v = el.value; if (el.type === 'number') v = Math.max(+el.min || 0, Math.min(+el.max || 999, parseInt(v, 10) || 0));
  if (!v && el.type !== 'number') return;
  S[obj][key] = v; touch('core'); render();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (focus) endFocus(); else if (sheetTaskId) closeSheet(); }
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && e.target.id === 'dump') $('[data-act="add"]').click();
});
function route() { const h = location.hash.slice(1); ui.view = ['day', 'week', 'month', 'semester'].includes(h) ? h : 'day'; render(); window.scrollTo(0, 0); }
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushNow(); else if (!focus && !sheetTaskId) render(); });
setInterval(() => { if (!focus && !sheetTaskId && ui.view === 'day' && !document.activeElement?.matches('input,textarea')) render(); }, 60000);

/* ---------- boot ---------- */
const local = loadLocal();
if (local && local.days) { S = Object.assign(blankState(), local); S.settings = { ...DEFAULT_SETTINGS, ...local.settings }; }
else { S = blankState(); seedExamples(S); planDay(today(), planFrom(today())); saveLocal(); }
route();
connectAccount();
window.__momentum = { planDay, parseLine, parseSteps, get S() { return S; } };
})();
</script>
